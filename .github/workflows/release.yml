name: Release

# Builds the packages on the three platforms and attaches them to the GitHub
# release of a tag:
# - a pushed tag v* (creating a release with a new tag in GitHub pushes the
#   tag too);
# - by hand (Actions > Release > Run workflow) for an existing tag.
# A release that does not exist yet is created as a draft with generated
# notes, and published once every package is attached; one made in GitHub
# is left as it is. Each package is tested before it is attached (unit
# tests, then the campaign and smoke replays played from the package).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build (for example v1.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Create the release if the tag has none
        id: release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Blip & Blop $TAG" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install sdl2 --triplet x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      # The packages carry the tag's version (v1.2.0 -> 1.2.0).
      - name: Configure
        run: cmake --preset release -DBB_PACKAGE_VERSION="${TAG#v}"

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Unit tests
        run: ctest --preset release -LE replay

      # Windows: NSIS installer and zip; macOS: disk image; Linux: .tar.gz.
      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -C RelWithDebInfo -B build/release/packages

      - name: Replays from the package
        run: |
          case "$RUNNER_OS" in
            Linux) package=$(ls build/release/packages/BlipBlop-*.tar.gz) ;;
            macOS) package=$(ls build/release/packages/BlipBlop-*.dmg) ;;
            Windows) package=$(ls build/release/packages/BlipBlop-*.zip) ;;
          esac
          tools/replays/package-replay.sh "$package" campaign smoke

      - name: Attach the packages to the release
        run: |
          find build/release/packages -maxdepth 1 -type f -name 'BlipBlop-*' -print0 |
            xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish
    needs: [release, packages]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
